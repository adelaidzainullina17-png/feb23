<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С 23 февраля!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ЭТО ГЛАВНЫЙ КОНТЕЙНЕР -->
    <div class="container">
        
        <!-- ЭТО КОНТЕЙНЕР С ВОПРОСАМИ (ПОКАЗЫВАЕТСЯ СНАЧАЛА) -->
        <div id="question-container" class="question-container">
            
            <!-- ЗДЕСЬ БУДЕТ КАРТИНКА ВОПРОСА -->
            <img id="question-image" class="question-image" src="" alt="вопрос">
            
            <!-- ЗДЕСЬ БУДЕТ ТЕКСТ ВОПРОСА -->
            <h2 id="question-text"></h2>
            
            <!-- КНОПКИ ДА/НЕТ -->
            <div class="buttons">
                <button id="btn-yes" class="btn btn-green">ДА</button>
                <button id="btn-no" class="btn btn-red">НЕТ</button>
            </div>
        </div>
        
        <!-- ЭТО КОНТЕЙНЕР С ПОДАРКОМ (СКРЫТ СНАЧАЛА) -->
        <div id="gift-container" class="gift-container hidden">
            <!-- СЮДА ВСТАВИТСЯ ОТКРЫТКА С ГАЛЕРЕЕЙ -->
        </div>
        
    </div>

    <!-- ПОДКЛЮЧАЕМ СКРИПТ -->
    <script src="script.js"></script>
</body>
</html>
